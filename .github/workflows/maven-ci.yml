name: BankSystem CI Automation

# 1. TRIGGER: Chạy khi có push hoặc tạo Pull Request vào nhánh main/master
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# MỚI: Cấp quyền cho workflow được phép viết bình luận vào Pull Request
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    # 1. Định nghĩa Matrix Strategy cho 3 hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # 2. Yêu cầu GitHub lấy hệ điều hành từ matrix để chạy
    runs-on: ${{ matrix.os }}

    steps:
      - name: Clone code từ kho lưu trữ
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Java (JDK 11)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven # Cached

      - name: Thực thi vòng đời Build và Test
        # Đổi từ package sang verify để JaCoCo kích hoạt bộ kiểm tra rule
        run: mvn -B clean verify

      - name: Lưu trữ tệp .jar
        uses: actions/upload-artifact@v4
        with:
          name: banksystem-executable-jar-${{ matrix.os }}
          path: target/*.jar

      - name: Trích xuất và lưu trữ báo cáo JaCoCo
        # if: always() đảm bảo rằng dù build có bị FAIL (do không đạt 80%) thì báo cáo vẫn được tải lên để bạn xem lại
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report-${{ matrix.os }}
          path: target/site/jacoco/

      # 2. INLINE FEEDBACK: Thêm action đăng comment tự động
      - name: Phản hồi Checkstyle tự động lên Pull Request
        # Chỉ chạy nếu đây là Pull Request, OS là Ubuntu, và chạy kể cả khi build lỗi (always)
        if: always() && github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: dbelyaev/action-checkstyle@v0.7.5
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review